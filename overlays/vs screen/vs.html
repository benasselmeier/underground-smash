<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VS Screen</title>
    <style>
        :root {
            --theme-primary: #E31E24;
            --theme-secondary: #B71C1C;
            --theme-accent: #FFFFFF;
            --theme-outline: #000;
        }

        body {
            background-image: url("../../Underground_Smash_Overlay/2.png");
            background-repeat: no-repeat;
            background-size: 100%;
            background-position: top;
            height: 100vh;
            width: 100vw;
            margin: 0;
            font-family: 'p5hatty', 'Arial', sans-serif;
        }

        /* .p1-character-image {
            background-image: url("../../Underground_Smash_Overlay/28.png");
            background-repeat: no-repeat;
            background-size: 100%;
            background-position: top;
            height: 100%;
            width: 40%;
            margin: auto 0 ;
            font-family: 'Roboto', sans-serif;
        }

            background-repeat: no-repeat;

        .vs-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        .vs-top-info {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 13vh;
            width: auto;
            padding: 0 24px;
            margin: 24px auto;
            font-size: 5em;
            font-family: 'p5hatty', 'Arial Black', sans-serif;
            color: white;
            background-image: url('../../images/background/persona-background-red.png');
            background-size: 1000px auto;
            background-repeat: no-repeat;
            background-position: center 20%;
            background-color: #5e0808;
            border: 5px solid var(--theme-outline);
            border-radius: 10px;
            box-shadow: 
                0 0 15px rgba(227, 30, 36, 0.4),
                0 4px 8px rgba(0, 0, 0, 0.6);
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 
                3px 3px 0 #000,
                -3px -3px 0 #000,
                3px -3px 0 #000,
                -3px 3px 0 #000,
                0 0 10px rgba(255, 255, 255, 0.4);
        }

        .vs-character-section {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            height: 50vh;
            width: 80vw;
            margin: 16px auto;
            /* border: 1px solid blue; */
        }

        .character-image {
            margin: 25% 0;
            height: 40vh;
            width: 25vw;
            /* border: 1px solid green; */
            align-content: center;
            object-fit: scale-down;
        }

        .vs-bottom-container {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            height: 9vh;
            width: 85vw;
            margin: 0px auto;
            /* border: 1px solid red; */
        }

        .player-info {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3em;
            height: auto;
            width: 30vw;
            /* border: 1px solid blue; */
            margin: 2px;
            padding: 20px;
            background-image: url('../../images/background/persona-background-red.png');
            background-size: 1000px auto;
            background-repeat: no-repeat;
            background-position: center 20%;
            background-color: #5e0808;
            border: 5px solid var(--theme-outline);
            border-radius: 10px;
            box-shadow: 
                0 0 15px rgba(227, 30, 36, 0.4),
                0 4px 8px rgba(0, 0, 0, 0.6);
            font-family: 'p5hatty', 'Arial', sans-serif;
            color: white;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 
                3px 3px 0 #000,
                -3px -3px 0 #000,
                3px -3px 0 #000,
                -3px 3px 0 #000,
                0 0 10px rgba(255, 255, 255, 0.4);
        }

        .player-sponsor {
            font-size: 0.5em;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }

        .gimme_pipe {
            color: #FFD700;
            font-size: 0.7em;
            margin: 0 5px;
            padding: 0;
        }

        .fade-update {
            transition: opacity 0.3s ease-in-out;
        }

        .middle-graphic {
            font-family: 'Persona5MenuFontPrototype-Rg', 'Arial Black', sans-serif;
            font-size: 10em;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .vs-event-container {
            font-family: 'Persona5MenuFontPrototype-Rg', 'Arial Black', sans-serif;
            color: #ef0404;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 20vh;
            width: 100vw;
            margin: 16px auto;
            font-size: 2em;
        }
    </style>
</head>

<body>
    <div class="vs-container">

        <div class="vs-top-info">
            <p id="round" class="fade-update"></p>
        </div>

        <div class="vs-character-section">
            <div class="p1-character-image">
                <img class="character-image fade-update" id="p1-character">
            </div>
            <div class="middle-graphic">
                vs
            </div>
            <div class="p2-character-image">
                <img class="character-image fade-update" id="p2-character">
            </div>
        </div>

        <div class="vs-bottom-container">
            <div class="player-info">
                <span id="p1-sponsor" class="player-sponsor fade-update"></span>
                <span id="p1-pipe" class="gimme_pipe">|</span>
                <span id="p1-player" class="fade-update"></span>
            </div>
            <div class="player-info">
                <span id="p2-sponsor" class="player-sponsor fade-update"></span>
                <span id="p2-pipe" class="gimme_pipe">|</span>
                <span id="p2-player" class="fade-update"></span>
            </div>
        </div>

        <div class="vs-event-container">
            <div class="event-title-text">
                <h1>Pubstomp</h1>
            </div>
    </div>

    <script>
        const FADE_TIME = 200;

        function fadeText(el, text) {
            if (el.textContent !== text) {
                el.style.opacity = '0';
                setTimeout(() => { el.textContent = text; el.style.opacity = '1'; }, FADE_TIME);
            }
        }

        function fadeImage(el, src, fallback) {
            if (el.getAttribute('data-current') !== src) {
                el.style.opacity = '0';
                el.onload = () => { el.style.opacity = '1'; };
                el.onerror = () => { if (fallback) el.src = fallback; el.style.opacity = '1'; };
                el.src = src;
                el.setAttribute('data-current', src);
            }
        }

        function fetchText(url, id) {
            fetch(url + '?t=' + Date.now())
                .then(r => r.text())
                .then(text => fadeText(document.getElementById(id), text))
                .catch(console.error);
        }

        function fetchSponsor(url, id, pipeId) {
            fetch(url + '?t=' + Date.now())
                .then(r => r.text())
                .then(text => {
                    fadeText(document.getElementById(id), text);
                    const pipe = document.getElementById(pipeId);
                    if (pipe) {
                        if (!text.trim()) {
                            pipe.style.visibility = 'hidden';
                        } else {
                            pipe.style.visibility = 'visible';
                        }
                    }
                })
                .catch(console.error);
        }

        function fetchFighter(url, id) {
            fetch(url + '?t=' + Date.now())
                .then(r => r.text())
                .then(name => {
                    const path = '../../images/fighter-portraits-stylized/cropped/' + name + '.png';
                    fadeImage(document.getElementById(id), path, '../../images/fighter-portraits-stylized/cropped/random.png');
                })
                .catch(console.error);
        }

        function update() {
            fadeText(document.getElementById('round'), 'Coming Up:');
            fetchFighter('../../text-files/player-1/Player1-Fighter.txt', 'p1-character');
            fetchFighter('../../text-files/player-2/Player2-Fighter.txt', 'p2-character');
            fetchText('../../text-files/player-1/Enter Player 1 Name.txt', 'p1-player');
            fetchText('../../text-files/player-2/Enter Player 2 Name.txt', 'p2-player');
            fetchSponsor('../../text-files/player-1/Player1-Sponsor.txt', 'p1-sponsor', 'p1-pipe');
            fetchSponsor('../../text-files/player-2/Player2-Sponsor.txt', 'p2-sponsor', 'p2-pipe');
        }

        update();
        setInterval(update, 1000);
    </script>

</body>

</html>
