<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standby Screen</title>
    <style>
        @font-face {
            font-family: 'p5hatty';
            src: local('p5hatty'),
                 url('../../resources/fonts/p5hatty.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --theme-primary: #E31E24;
            --theme-secondary: #B71C1C;
            --theme-accent: #FFFFFF;
            --theme-outline: #000;
        }

        body {
            background-image: url("../../Underground_Smash_Overlay/2.png");
            background-repeat: no-repeat;
            background-size: 100%;
            background-position: top;
            height: 100vh;
            width: 100vw;
            margin: 0;
            font-family: 'p5hatty', 'Arial Black', sans-serif;
            overflow: hidden;
        }

        .standby-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        .main-content-area {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            height: auto;
            width: 100vw;
            margin: 20px 0;
            padding: 0;
            gap: 60px;
        }

        .standby-header {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 10vh;
            width: auto;
            padding: 0 24px;
            margin: 15px auto;
            font-size: 4em;
            font-family: 'p5hatty', 'Arial Black', sans-serif;
            color: white;
            background-image: url('../../images/background/persona-background-red.png');
            background-size: 1000px auto;
            background-repeat: no-repeat;
            background-position: center 20%;
            background-color: #5e0808;
            border: 5px solid var(--theme-outline);
            border-radius: 10px;
            box-shadow: 
                0 0 15px rgba(227, 30, 36, 0.4),
                0 4px 8px rgba(0, 0, 0, 0.6);
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 
                3px 3px 0 #000,
                -3px -3px 0 #000,
                3px -3px 0 #000,
                -3px 3px 0 #000,
                0 0 10px rgba(255, 255, 255, 0.4);
        }

        .video-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: auto;
            width: auto;
            margin: 0;
            gap: 20px;
        }

        .video-container {
            position: relative;
            width: 600px;
            height: 338px;
            background-color: #1a1a1a;
            border: 3px solid var(--theme-outline);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 
                0 0 15px rgba(227, 30, 36, 0.3),
                0 4px 8px rgba(0, 0, 0, 0.5);
        }

        .video-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            color: #666;
            background: linear-gradient(45deg, #2a2a2a, #1a1a1a);
        }

        .video-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(94, 8, 8, 0.9);
            color: white;
            padding: 8px 16px;
            border-radius: 5px;
            font-size: 1.2em;
            font-weight: 900;
            text-shadow: 
                2px 2px 0 #000,
                -2px -2px 0 #000,
                2px -2px 0 #000,
                -2px 2px 0 #000;
        }

        .event-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 12vh;
            width: 60vw;
            max-width: 800px;
            margin: 10px auto 20px auto;
            background-image: url('../../images/background/persona-background-red.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
            background-color: #5e0808;
            border: 5px solid var(--theme-outline);
            border-radius: 10px;
            box-shadow: 
                0 0 15px rgba(227, 30, 36, 0.4),
                0 4px 8px rgba(0, 0, 0, 0.6);
            font-family: 'p5hatty', 'Arial Black', sans-serif;
            color: white;
            text-align: center;
        }

        /* Player Information Section */
        .player-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 350px;
            min-width: 350px;
        }

        .character-display {
            width: 350px;
            height: 400px;
            margin-bottom: 20px;
            border: none;
            border-radius: 0;
            overflow: hidden;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .character-image-standby {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            object-position: center;
            filter: drop-shadow(3px 3px 6px rgba(0, 0, 0, 0.7))
                    drop-shadow(-1px -1px 2px rgba(0, 0, 0, 0.5));
        }

        .player-name-display {
            background-image: url('../../images/background/persona-background-red.png');
            background-size: 1000px auto;
            background-repeat: no-repeat;
            background-position: center 20%;
            background-color: #5e0808;
            border: 5px solid var(--theme-outline);
            border-radius: 10px;
            box-shadow: 
                0 0 15px rgba(227, 30, 36, 0.4),
                0 4px 8px rgba(0, 0, 0, 0.6);
            padding: 20px 30px;
            font-family: 'p5hatty', 'Arial Black', sans-serif;
            color: white;
            text-align: center;
            width: calc(100% - 60px);
            max-width: 350px;
            height: 160px;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            min-height: 160px;
            position: relative;
        }

        .player-text-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        .player-name {
            font-size: 2.2em;
            font-weight: 900;
            margin: 0;
            letter-spacing: 1px;
            text-shadow: 
                3px 3px 0 #000,
                -3px -3px 0 #000,
                3px -3px 0 #000,
                -3px 3px 0 #000,
                0 0 10px rgba(255, 255, 255, 0.4);
        }

        .player-sponsor-standby {
            font-size: 1.4em;
            color: #FFD700;
            margin: 8px 0 0 0;
            text-shadow: 
                2px 2px 0 #000,
                -2px -2px 0 #000,
                2px -2px 0 #000,
                -2px 2px 0 #000;
        }

        .player-info-row {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            width: 100%;
        }

        .game-count-display {
            background-color: rgba(0, 0, 0, 0.8);
            border: 3px solid var(--theme-outline);
            border-radius: 50%;
            padding: 15px;
            font-family: 'p5hatty', 'Arial Black', sans-serif;
            color: white;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 60px;
            height: 60px;
            box-shadow: 
                0 0 15px rgba(227, 30, 36, 0.4),
                0 4px 8px rgba(0, 0, 0, 0.6);
        }

        /* Position game count on the outer edge for each player */
        .player-display:first-child .game-count-display {
            order: -1; /* Move to the left side for player 1 */
        }

        .player-display:last-child .game-count-display {
            order: 1; /* Keep on the right side for player 2 */
        }

        .game-count-label {
            display: none; /* Hide the "Games:" label */
        }

        .game-count-number {
            font-size: 2.2em;
            font-weight: 900;
            margin: 0;
            letter-spacing: 1px;
            text-shadow: 
                3px 3px 0 #000,
                -3px -3px 0 #000,
                3px -3px 0 #000,
                -3px 3px 0 #000,
                0 0 10px rgba(255, 255, 255, 0.4);
        }

        .event-title {
            font-size: 3em;
            font-weight: 900;
            margin: 0;
            letter-spacing: 2px;
            text-shadow: 
                3px 3px 0 #000,
                -3px -3px 0 #000,
                3px -3px 0 #000,
                -3px 3px 0 #000,
                0 0 10px rgba(255, 255, 255, 0.4);
        }

        .event-subtitle {
            font-size: 1.5em;
            margin: 5px 0 0 0;
            color: #FFD700;
            text-shadow: 
                2px 2px 0 #000,
                -2px -2px 0 #000,
                2px -2px 0 #000,
                -2px 2px 0 #000;
        }

        .fade-update {
            transition: opacity 0.3s ease-in-out;
        }

        /* Theme support placeholder - will be overridden by theme CSS */
    </style>
    
    <!-- Theme CSS will be dynamically loaded here -->
    <link id="theme-css" rel="stylesheet" type="text/css" href="">
</head>

<body>
    <div class="standby-container">
        
        <div class="standby-header">
            <span id="standby-status" class="fade-update">Between Games</span>
        </div>

        <div class="main-content-area">
            <div class="player-display">
                <div class="character-display">
                    <img class="character-image-standby fade-update" id="p1-character">
                </div>
                <div class="player-info-row">
                    <div class="player-name-display">
                        <div class="game-count-display">
                            <div class="game-count-number fade-update" id="p1-game-count">0</div>
                        </div>
                        <div class="player-text-content">
                            <div class="player-name fade-update" id="p1-player"></div>
                            <div class="player-sponsor-standby fade-update" id="p1-sponsor"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="video-section">
                <div class="video-container">
                    <div class="video-label">Game Feed</div>
                    <div class="video-placeholder" id="game-feed">
                        Game Video Feed
                    </div>
                </div>
                
                <div class="video-container">
                    <div class="video-label">Venue Camera</div>
                    <div class="video-placeholder" id="venue-feed">
                        Venue Camera Feed
                    </div>
                </div>
            </div>

            <div class="player-display">
                <div class="character-display">
                    <img class="character-image-standby fade-update" id="p2-character">
                </div>
                <div class="player-info-row">
                    <div class="player-name-display">
                        <div class="player-text-content">
                            <div class="player-name fade-update" id="p2-player"></div>
                            <div class="player-sponsor-standby fade-update" id="p2-sponsor"></div>
                        </div>
                        <div class="game-count-display">
                            <div class="game-count-number fade-update" id="p2-game-count">0</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="event-info">
            <h1 id="event-title" class="event-title fade-update">PubStomp</h1>
            <p id="event-subtitle" class="event-subtitle fade-update">Tournament in Progress</p>
        </div>

    </div>

    <script>
        const FADE_TIME = 200;

        function fadeText(el, text) {
            if (el.textContent !== text) {
                el.style.opacity = '0';
                setTimeout(() => { el.textContent = text; el.style.opacity = '1'; }, FADE_TIME);
            }
        }

        function fadeImage(el, src, fallback) {
            if (el.getAttribute('data-current') !== src) {
                el.style.opacity = '0';
                el.onload = () => { el.style.opacity = '1'; };
                el.onerror = () => { if (fallback) el.src = fallback; el.style.opacity = '1'; };
                el.src = src;
                el.setAttribute('data-current', src);
            }
        }

        function fetchText(url, id) {
            fetch(url + '?t=' + Date.now())
                .then(r => r.text())
                .then(text => fadeText(document.getElementById(id), text))
                .catch(console.error);
        }

        function fetchSponsor(url, id) {
            fetch(url + '?t=' + Date.now())
                .then(r => r.text())
                .then(text => {
                    const element = document.getElementById(id);
                    if (element) {
                        if (!text.trim()) {
                            element.style.display = 'none';
                        } else {
                            element.style.display = 'block';
                            fadeText(element, text);
                        }
                    }
                })
                .catch(console.error);
        }

        function fetchFighter(url, id) {
            fetch(url + '?t=' + Date.now())
                .then(r => r.text())
                .then(name => {
                    const path = '../../images/fighter-portraits-stylized/cropped/' + name + '.png';
                    fadeImage(document.getElementById(id), path, '../../images/fighter-portraits-stylized/cropped/random.png');
                })
                .catch(console.error);
        }

        function loadTheme() {
            // Load current theme from theme file
            fetch('../../text-files/info/Current-Theme.txt?t=' + Date.now())
                .then(r => r.text())
                .then(theme => {
                    const themeName = theme.trim() || 'default';
                    const themeCSS = document.getElementById('theme-css');
                    themeCSS.href = `../../themes/standby/${themeName}.css`;
                })
                .catch(() => {
                    // Default to default theme if theme file doesn't exist
                    const themeCSS = document.getElementById('theme-css');
                    themeCSS.href = '../../themes/standby/default.css';
                });
        }

        function update() {
            // Fetch dynamic text content
            fetchText('../../text-files/info/Standby-Status.txt', 'standby-status');
            fetchText('../../text-files/info/Event-Title.txt', 'event-title');
            fetchText('../../text-files/info/Current-Round.txt', 'event-subtitle');
            
            // Fetch player information
            fetchText('../../text-files/player-1/Enter Player 1 Name.txt', 'p1-player');
            fetchText('../../text-files/player-2/Enter Player 2 Name.txt', 'p2-player');
            fetchSponsor('../../text-files/player-1/Player1-Sponsor.txt', 'p1-sponsor');
            fetchSponsor('../../text-files/player-2/Player2-Sponsor.txt', 'p2-sponsor');
            
            // Fetch game counts (using same source as scoreboard)
            fetchText('../../text-files/player-1/Player1-Score.txt', 'p1-game-count');
            fetchText('../../text-files/player-2/Player2-Score.txt', 'p2-game-count');
            
            // Fetch character images
            fetchFighter('../../text-files/player-1/Player1-Fighter.txt', 'p1-character');
            fetchFighter('../../text-files/player-2/Player2-Fighter.txt', 'p2-character');
            
            // Reload theme in case it changed
            loadTheme();
        }

        // Initialize
        loadTheme();
        update();
        setInterval(update, 1000);
    </script>

</body>

</html>
