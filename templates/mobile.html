<!DOCTYPE html>
<html>
<head>
    <title>Mobile Control Panel</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Stream Control">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #303040;
            background-image: radial-gradient(circle at center, #404060 0%, #202030 100%);
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 8px;
            color: white;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin: 0 0 16px 0;
            color: white;
            background-color: #000;
            border: 2px solid #fff;
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.5);
            position: sticky;
            top: 8px;
            z-index: 100;
        }

        .header h1 {
            margin: 0;
            font-size: 18px;
        }

        .saving-indicator {
            display: none;
            color: #fff;
            font-weight: bold;
            margin-top: 8px;
            background: #000;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #fff;
            font-size: 12px;
        }

        /* Mobile-first responsive layout */
        .mobile-container {
            max-width: 100%;
            margin: 0 auto;
        }

        .section {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            margin-bottom: 16px;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .section-title {
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            padding: 8px;
            text-align: center;
            border-radius: 4px;
            font-size: 14px;
        }

        .section-title.player1 {
            background-color: rgba(255, 50, 50, 0.8);
            box-shadow: 0 0 10px rgba(255, 50, 50, 0.3);
        }

        .section-title.player2 {
            background-color: rgba(50, 50, 255, 0.8);
            box-shadow: 0 0 10px rgba(50, 50, 255, 0.3);
        }

        .section-title.caster {
            background-color: rgba(120, 120, 120, 0.8);
            box-shadow: 0 0 10px rgba(120, 120, 120, 0.3);
        }

        .section-title.info {
            background-color: rgba(50, 150, 50, 0.8);
            box-shadow: 0 0 10px rgba(50, 150, 50, 0.3);
        }

        .section-title.actions {
            background-color: rgba(255, 165, 0, 0.8);
            box-shadow: 0 0 10px rgba(255, 165, 0, 0.3);
        }

        .form-row {
            margin-bottom: 12px;
        }

        .form-label {
            display: block;
            margin-bottom: 4px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-text, .form-select {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 16px;
            min-height: 44px;
            transition: all 0.2s ease;
        }

        .form-text:focus, .form-select:focus {
            outline: none;
            background-color: white;
            box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.6);
        }

        textarea.form-text {
            resize: vertical;
            min-height: 44px;
            font-family: inherit;
        }

        /* Character selection styling */
        .character-selector {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            margin-bottom: 8px;
        }

        .character-selector:active {
            transform: scale(0.98);
        }

        .character-selector:hover {
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        .character-preview {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .character-preview img {
            max-width: 60px;
            max-height: 60px;
            object-fit: contain;
            margin-bottom: 4px;
        }

        .character-preview span {
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            color: white;
        }

        /* Score selector row */
        .score-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .score-buttons {
            display: flex;
            gap: 4px;
        }

        .score-btn {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .score-btn.minus {
            background-color: rgba(255, 50, 50, 0.8);
            color: white;
        }

        .score-btn.plus {
            background-color: rgba(50, 150, 50, 0.8);
            color: white;
        }

        .score-btn:active {
            transform: scale(0.9);
        }

        .score-select {
            flex: 1;
            margin: 0 8px;
        }

        /* Quick actions grid */
        .quick-actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .action-button {
            padding: 16px 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            min-height: 60px;
            color: white;
        }

        .action-button:active {
            transform: scale(0.95);
        }

        .action-button i {
            font-size: 20px;
            font-style: normal;
        }

        .action-button span {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .action-button.p1 {
            background-color: rgba(255, 50, 50, 0.8);
        }

        .action-button.p2 {
            background-color: rgba(50, 50, 255, 0.8);
        }

        .action-button.swap {
            background-color: rgba(150, 50, 150, 0.8);
        }

        .action-button.refresh {
            background-color: rgba(255, 165, 0, 0.8);
        }

        .action-button.new-round {
            background-color: rgba(50, 150, 50, 0.8);
        }

        .action-button.save {
            background-color: rgba(50, 150, 150, 0.8);
        }

        /* Losers bracket toggle styling */
        .losers-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .losers-toggle:hover {
            background: rgba(255, 215, 0, 0.1);
            border-color: rgba(255, 215, 0, 0.6);
        }

        .losers-toggle input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #FFD700;
            cursor: pointer;
        }

        .losers-toggle .losers-text {
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
        }

        /* Theme selector */
        .theme-selector-container {
            grid-column: 1 / -1;
            margin-top: 8px;
        }

        .theme-selector-label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .theme-selector {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 14px;
        }

        /* Character grid modal */
        .character-grid-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .character-grid-backdrop.active {
            opacity: 1;
            visibility: visible;
        }

        .character-grid {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 95%;
            max-width: 600px;
            max-height: 80vh;
            background-color: #2a2a3a;
            border-radius: 12px;
            border: 2px solid #fff;
            z-index: 1001;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .character-grid.active {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .character-grid-header {
            padding: 16px;
            background-color: #1a1a2a;
            border-bottom: 1px solid #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .character-grid-header h3 {
            margin: 0;
            color: white;
            font-size: 16px;
        }

        .character-grid-close {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
        }

        .character-grid-content {
            padding: 16px;
            max-height: calc(80vh - 80px);
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px;
        }

        .character-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.2s ease;
            min-height: 80px;
            justify-content: center;
        }

        .character-item:active {
            transform: scale(0.95);
            background-color: rgba(255, 255, 255, 0.3);
        }

        .character-item img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            margin-bottom: 4px;
        }

        .character-item span {
            font-size: 10px;
            text-align: center;
            color: white;
            font-weight: bold;
            line-height: 1.2;
        }

        /* Two-column layout for casters */
        .caster-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        /* Info section special styling */
        .info-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .info-row-label {
            font-size: 12px;
            font-weight: bold;
            min-width: 80px;
            text-transform: uppercase;
        }

        .info-row input, .info-row select {
            flex: 1;
        }

        /* Animations */
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        .pulse-animation {
            animation: pulse 0.3s ease;
        }

        /* Social network dropdown styling */
        .social-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .social-select {
            flex: 0 0 100px;
            padding: 8px;
            border: none;
            border-radius: 4px;
            background-color: rgba(255, 255, 255, 0.8);
            color: #333;
            font-size: 12px;
        }

        .social-input {
            flex: 1;
        }

        /* Mobile-specific improvements */
        @media (max-width: 480px) {
            .quick-actions-grid {
                grid-template-columns: 1fr 1fr;
            }
            
            .caster-columns {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            
            .character-grid-content {
                grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>📱 Mobile Stream Control</h1>
        <div class="saving-indicator" id="saving-indicator">Saving...</div>
    </div>

    <div class="mobile-container">
        <form id="auto-save-form" method="POST">
            
            <!-- Quick Actions Section -->
            <div class="section">
                <div class="section-title actions">⚡ Quick Actions</div>
                <div class="quick-actions-grid">
                    <button type="button" class="action-button p1" onclick="updatePlayerScore('player1', 1)">
                        <i>+1</i>
                        <span>P1 Score</span>
                    </button>
                    <button type="button" class="action-button p2" onclick="updatePlayerScore('player2', 1)">
                        <i>+1</i>
                        <span>P2 Score</span>
                    </button>
                    <button type="button" class="action-button p1" onclick="updatePlayerScore('player1', -1)">
                        <i>-1</i>
                        <span>P1 Score</span>
                    </button>
                    <button type="button" class="action-button p2" onclick="updatePlayerScore('player2', -1)">
                        <i>-1</i>
                        <span>P2 Score</span>
                    </button>
                    <button type="button" class="action-button swap" onclick="swapPlayers()">
                        <i>⇄</i>
                        <span>Swap Players</span>
                    </button>
                    <button type="button" class="action-button refresh" onclick="resetScoreboard()">
                        <i>↺</i>
                        <span>Reset</span>
                    </button>
                    <button type="button" class="action-button new-round" onclick="newRound()">
                        <i>🏁</i>
                        <span>New Round</span>
                    </button>
                    <button type="button" class="action-button save" onclick="saveAllChanges()">
                        <i>💾</i>
                        <span>Save All</span>
                    </button>
                    <div class="theme-selector-container">
                        <label for="theme-selector" class="theme-selector-label">Scoreboard Theme:</label>
                        <select id="theme-selector" class="theme-selector" onchange="changeTheme()">
                            <option value="pubstomp">Pubstomp (Persona Theme)</option>
                            <option value="default">Default (Blue Modern)</option>
                            <option value="sonic">Sonic (Green Hill Zone)</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Player 1 Section -->
            <div class="section">
                <div class="section-title player1">🎮 Player 1</div>
                
                <div class="form-row">
                    <label class="form-label">Sponsor/Team</label>
                    <input type="text" class="form-text" name="Player1-Sponsor.txt" 
                           value="{{ player_1_files['Player1-Sponsor.txt'] }}" placeholder="Team/Sponsor">
                </div>

                <div class="form-row">
                    <label class="form-label">Player Name</label>
                    <textarea class="form-text" name="Enter Player 1 Name.txt" 
                              placeholder="Player 1 Name">{{ player_1_files['Enter Player 1 Name.txt'] }}</textarea>
                </div>

                <div class="form-row">
                    <label class="form-label">Character</label>
                    <div class="character-selector" onclick="openCharacterGrid('player1')" 
                         role="button" tabindex="0" aria-label="Select character for Player 1">
                        <div class="character-preview">
                            <img id="player1-fighter-preview" 
                                 src="/images/fighter-ui-slice/{{ player_1_files['Player1-Fighter.txt']|lower }}.png"
                                 alt="Player 1 Character">
                            <span id="player1-fighter-name">{{ player_1_files['Player1-Fighter.txt'] }}</span>
                        </div>
                        <input type="hidden" name="Player1-Fighter.txt" id="player1-fighter-input"
                               value="{{ player_1_files['Player1-Fighter.txt'] }}">
                    </div>
                </div>

                <div class="form-row">
                    <label class="form-label">Score</label>
                    <div class="score-row">
                        <div class="score-buttons">
                            <button type="button" class="score-btn minus" onclick="updatePlayerScore('player1', -1)">-</button>
                        </div>
                        <select class="form-select score-select" name="Player1-Score.txt">
                            <option value="0" {% if player_1_files['Player1-Score.txt'] == '0' %}selected{% endif %}>0</option>
                            <option value="1" {% if player_1_files['Player1-Score.txt'] == '1' %}selected{% endif %}>1</option>
                            <option value="2" {% if player_1_files['Player1-Score.txt'] == '2' %}selected{% endif %}>2</option>
                            <option value="3" {% if player_1_files['Player1-Score.txt'] == '3' %}selected{% endif %}>3</option>
                        </select>
                        <div class="score-buttons">
                            <button type="button" class="score-btn plus" onclick="updatePlayerScore('player1', 1)">+</button>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <label class="form-label">Losers Bracket</label>
                    <label class="losers-toggle">
                        <input type="checkbox" class="losers-checkbox" name="Player1-Losers.txt" 
                               {% if player_1_files['Player1-Losers.txt'] == '1' %}checked{% endif %}>
                        <span class="losers-text">From Losers</span>
                    </label>
                </div>
            </div>

            <!-- Player 2 Section -->
            <div class="section">
                <div class="section-title player2">🎮 Player 2</div>
                
                <div class="form-row">
                    <label class="form-label">Sponsor/Team</label>
                    <input type="text" class="form-text" name="Player2-Sponsor.txt" 
                           value="{{ player_2_files['Player2-Sponsor.txt'] }}" placeholder="Team/Sponsor">
                </div>

                <div class="form-row">
                    <label class="form-label">Player Name</label>
                    <textarea class="form-text" name="Enter Player 2 Name.txt" 
                              placeholder="Player 2 Name">{{ player_2_files['Enter Player 2 Name.txt'] }}</textarea>
                </div>

                <div class="form-row">
                    <label class="form-label">Character</label>
                    <div class="character-selector" onclick="openCharacterGrid('player2')" 
                         role="button" tabindex="0" aria-label="Select character for Player 2">
                        <div class="character-preview">
                            <img id="player2-fighter-preview" 
                                 src="/images/fighter-ui-slice/{{ player_2_files['Player2-Fighter.txt']|lower }}.png"
                                 alt="Player 2 Character">
                            <span id="player2-fighter-name">{{ player_2_files['Player2-Fighter.txt'] }}</span>
                        </div>
                        <input type="hidden" name="Player2-Fighter.txt" id="player2-fighter-input"
                               value="{{ player_2_files['Player2-Fighter.txt'] }}">
                    </div>
                </div>

                <div class="form-row">
                    <label class="form-label">Score</label>
                    <div class="score-row">
                        <div class="score-buttons">
                            <button type="button" class="score-btn minus" onclick="updatePlayerScore('player2', -1)">-</button>
                        </div>
                        <select class="form-select score-select" name="Player2-Score.txt">
                            <option value="0" {% if player_2_files['Player2-Score.txt'] == '0' %}selected{% endif %}>0</option>
                            <option value="1" {% if player_2_files['Player2-Score.txt'] == '1' %}selected{% endif %}>1</option>
                            <option value="2" {% if player_2_files['Player2-Score.txt'] == '2' %}selected{% endif %}>2</option>
                            <option value="3" {% if player_2_files['Player2-Score.txt'] == '3' %}selected{% endif %}>3</option>
                        </select>
                        <div class="score-buttons">
                            <button type="button" class="score-btn plus" onclick="updatePlayerScore('player2', 1)">+</button>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <label class="form-label">Losers Bracket</label>
                    <label class="losers-toggle">
                        <input type="checkbox" class="losers-checkbox" name="Player2-Losers.txt" 
                               {% if player_2_files['Player2-Losers.txt'] == '1' %}checked{% endif %}>
                        <span class="losers-text">From Losers</span>
                    </label>
                </div>
            </div>

            <!-- Casters Section -->
            <div class="section">
                <div class="section-title caster">🎤 Casters</div>
                <div class="caster-columns">
                    <!-- Caster 1 -->
                    <div>
                        <h4 style="margin: 0 0 12px 0; text-align: center;">Caster 1</h4>
                        <div class="form-row">
                            <label class="form-label">Sponsor/Team</label>
                            <input type="text" class="form-text" name="Caster1-Sponsor.txt" 
                                   value="{{ casters_files['Caster1-Sponsor.txt'] }}" placeholder="Team/Sponsor">
                        </div>
                        <div class="form-row">
                            <label class="form-label">Name</label>
                            <textarea class="form-text" name="Caster1-Name.txt" 
                                      placeholder="Caster 1 Name">{{ casters_files['Caster1-Name.txt'] }}</textarea>
                        </div>
                        <div class="form-row">
                            <label class="form-label">Social Profile</label>
                            <div class="social-row">
                                <select class="social-select" id="caster1-social-network">
                                    <option value="Twitter">Twitter</option>
                                    <option value="BlueSky">BlueSky</option>
                                </select>
                                <textarea class="form-text social-input" name="Caster1-Profile.txt"
                                          placeholder="@username">{{ casters_files['Caster1-Profile.txt'] }}</textarea>
                            </div>
                        </div>
                    </div>

                    <!-- Caster 2 -->
                    <div>
                        <h4 style="margin: 0 0 12px 0; text-align: center;">Caster 2</h4>
                        <div class="form-row">
                            <label class="form-label">Sponsor/Team</label>
                            <input type="text" class="form-text" name="Caster2-Sponsor.txt" 
                                   value="{{ casters_files['Caster2-Sponsor.txt'] }}" placeholder="Team/Sponsor">
                        </div>
                        <div class="form-row">
                            <label class="form-label">Name</label>
                            <textarea class="form-text" name="Caster2-Name.txt" 
                                      placeholder="Caster 2 Name">{{ casters_files['Caster2-Name.txt'] }}</textarea>
                        </div>
                        <div class="form-row">
                            <label class="form-label">Social Profile</label>
                            <div class="social-row">
                                <select class="social-select" id="caster2-social-network">
                                    <option value="Twitter">Twitter</option>
                                    <option value="BlueSky">BlueSky</option>
                                </select>
                                <textarea class="form-text social-input" name="Caster2-Profile.txt"
                                          placeholder="@username">{{ casters_files['Caster2-Profile.txt'] }}</textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tournament Info Section -->
            <div class="section">
                <div class="section-title info">ℹ️ Tournament Info</div>
                
                <div class="form-row">
                    <label class="form-label">Bracket/Tournament Name</label>
                    <textarea class="form-text" name="Bracket-Name.txt" 
                              placeholder="Tournament Bracket Name">{{ info_files['Bracket-Name.txt'] }}</textarea>
                </div>

                <div class="form-row">
                    <label class="form-label">Current Round</label>
                    <textarea class="form-text" name="Current-Round.txt" 
                              placeholder="e.g., Winners Finals">{{ info_files['Current-Round.txt'] }}</textarea>
                </div>

                <div class="form-row">
                    <label class="form-label">Event Info</label>
                    <textarea class="form-text" name="event-info.txt" 
                              placeholder="Additional event information">{{ info_files['event-info.txt'] }}</textarea>
                </div>

                <div class="form-row">
                    <div class="info-row">
                        <label class="info-row-label">Best Of:</label>
                        <select class="form-select" name="Best-Of.txt">
                            <option value="1" {% if info_files['Best-Of.txt'] == '1' %}selected{% endif %}>Best of 1</option>
                            <option value="3" {% if info_files['Best-Of.txt'] == '3' %}selected{% endif %}>Best of 3</option>
                            <option value="5" {% if info_files['Best-Of.txt'] == '5' %}selected{% endif %}>Best of 5</option>

                    <div class="info-row">
                        <label class="info-row-label">start.gg/</label>
                        <input type="text" class="form-text" name="Startgg-Slug.txt"
                               value="{{ info_files['Startgg-Slug.txt'] }}" placeholder="tournament-slug">
                    </div>
                </div>

                <div class="form-row">
                    <label class="form-label">Stream Info</label>
                    <input type="text" class="form-text" name="Stream-Info.txt"

    <!-- Character Selection Grid -->
    <div class="character-grid-backdrop" id="character-grid-backdrop"></div>
    <div class="character-grid" id="character-grid">
        <div class="character-grid-header">
            <h3>SELECT A CHARACTER</h3>
            <button class="character-grid-close" onclick="closeCharacterGrid()">×</button>
        </div>
        <div class="character-grid-content" id="character-grid-content">
            <!-- Characters will be loaded here dynamically -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            const form = document.getElementById('auto-save-form');
            const formElements = form.querySelectorAll('input, select, textarea');
            const header = document.querySelector('.header');
            const savingIndicator = document.getElementById('saving-indicator');
            
            // Initialize social network dropdowns
            initializeSocialNetworks();
            
            // Initialize theme selector
            initializeThemeSelector();

            // Add a pulsing animation style
            const style = document.createElement('style');
            style.id = 'saving-animation';
            style.textContent = `
                @keyframes pulse {
                    0% { transform: scale(1); }
                    100% { transform: scale(1.05); }
                }
            `;
            document.head.appendChild(style);

            // Handle individual form element changes
            formElements.forEach(element => {
                element.addEventListener('change', () => {
                    // Skip if the change was triggered by our quick actions
                    if (element.hasAttribute('data-programmatic-change')) {
                        element.removeAttribute('data-programmatic-change');
                        return;
                    }

                    savingIndicator.style.display = 'block';
                    savingIndicator.style.animation = 'pulse 0.5s infinite alternate';

                    // Use fetch API for AJAX form submission
                    const formData = new FormData(form);
                    
                    // Handle checkboxes manually - convert to 1/0 values
                    const checkboxes = form.querySelectorAll('input[type="checkbox"]');
                    checkboxes.forEach(checkbox => {
                        if (checkbox.name) {
                            formData.delete(checkbox.name);
                            formData.append(checkbox.name, checkbox.checked ? '1' : '0');
                        }
                    });

                    fetch(form.action || window.location.href, {
                        method: 'POST',
                        body: formData,
                        headers: {
                            'X-Requested-With': 'XMLHttpRequest'
                        }
                    })
                        .then(response => {
                            if (!response.ok) {
                                throw new Error('Network response was not ok');
                            }
                            return response.text();
                        })
                        .then(() => {
                            // Success handling
                            setTimeout(() => {
                                savingIndicator.style.display = 'none';
                                savingIndicator.style.animation = 'none';
                            }, 1000);
                        })
                        .catch(error => {
                            console.error('Error saving form:', error);
                            savingIndicator.textContent = 'Error!';
                            savingIndicator.style.color = '#ff3333';
                            setTimeout(() => {
                                savingIndicator.style.display = 'none';
                                savingIndicator.style.animation = 'none';
                                savingIndicator.textContent = 'Saving...';
                                savingIndicator.style.color = '#fff';
                            }, 2000);
                        });
                });
            });

            // Prevent normal form submission
            form.addEventListener('submit', function (e) {
                e.preventDefault();
                saveAllChanges();
            });

            // Load all fighters for the character grid
            loadFighters();
            
            // Add click event listener to close character grid when clicking outside
            const characterGridBackdrop = document.getElementById('character-grid-backdrop');
            characterGridBackdrop.addEventListener('click', function(e) {
                closeCharacterGrid();
            });
            
            // Prevent clicks on the grid itself from closing it
            const characterGrid = document.getElementById('character-grid');
            characterGrid.addEventListener('click', function(e) {
                e.stopPropagation();
            });

            // Auto-resize textareas
            const textareas = form.querySelectorAll('textarea');
            textareas.forEach(textarea => {
                adjustTextareaHeight(textarea);
                textarea.addEventListener('input', function () {
                    adjustTextareaHeight(this);
                });
            });
        });

        // Function to adjust textarea height based on content
        function adjustTextareaHeight(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.max(44, textarea.scrollHeight) + 'px';
        }

        // Function to initialize social network dropdowns
        function initializeSocialNetworks() {
            const caster1SocialNetwork = document.getElementById('caster1-social-network');
            const caster1SocialNetworkValue = localStorage.getItem('caster1-social-network') || 'Twitter';
            caster1SocialNetwork.value = caster1SocialNetworkValue;
            
            const caster2SocialNetwork = document.getElementById('caster2-social-network');
            const caster2SocialNetworkValue = localStorage.getItem('caster2-social-network') || 'Twitter';
            caster2SocialNetwork.value = caster2SocialNetworkValue;
            
            caster1SocialNetwork.addEventListener('change', function() {
                localStorage.setItem('caster1-social-network', this.value);
                updateCasterSocialDisplay(1, this.value);
            });
            
            caster2SocialNetwork.addEventListener('change', function() {
                localStorage.setItem('caster2-social-network', this.value);
                updateCasterSocialDisplay(2, this.value);
            });
            
            updateCasterSocialDisplay(1, caster1SocialNetworkValue);
            updateCasterSocialDisplay(2, caster2SocialNetworkValue);
        }
        
        function updateCasterSocialDisplay(casterNum, network) {
            const textarea = document.querySelector(`textarea[name="Caster${casterNum}-Profile.txt"]`);
            const currentValue = textarea.value;
            
            if (!currentValue.trim()) return;
            
            let handle = currentValue;
            if (currentValue.startsWith('@') || currentValue.startsWith('twitter.com/') || 
                currentValue.startsWith('bsky.app/')) {
                if (currentValue.includes('/')) {
                    handle = currentValue.split('/').pop();
                } else if (currentValue.startsWith('@')) {
                    handle = currentValue.substring(1);
                }
            }
            
            if (network === 'Twitter') {
                textarea.placeholder = '@username';
                if (handle && !handle.startsWith('@') && !handle.startsWith('twitter.com/')) {
                    textarea.value = '@' + handle;
                }
            } else if (network === 'BlueSky') {
                textarea.placeholder = 'username';
                if (handle && !handle.startsWith('bsky.app/')) {
                    textarea.value = handle;
                }
            }
        }

        // Theme management functions
        function initializeThemeSelector() {
            const themeSelector = document.getElementById('theme-selector');
            
            fetch('/text-files/info/Theme.txt?t=' + Date.now())
                .then(response => response.text())
                .then(currentTheme => {
                    const theme = currentTheme.trim().toLowerCase();
                    if (theme && themeSelector.querySelector(`option[value="${theme}"]`)) {
                        themeSelector.value = theme;
                    } else {
                        themeSelector.value = 'pubstomp';
                    }
                })
                .catch(error => {
                    console.error('Error loading current theme:', error);
                    themeSelector.value = 'pubstomp';
                });
        }
        
        function changeTheme() {
            const themeSelector = document.getElementById('theme-selector');
            const selectedTheme = themeSelector.value;
            
            const formData = new FormData();
            formData.append('Theme.txt', selectedTheme);
            
            const originalStyle = themeSelector.style.cssText;
            themeSelector.style.backgroundColor = 'rgba(255, 255, 255, 0.9)';
            themeSelector.style.color = '#000';
            themeSelector.style.transform = 'scale(1.05)';
            
            fetch('/save-theme', {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to save theme');
                }
                return response.text();
            })
            .then(() => {
                setTimeout(() => {
                    themeSelector.style.cssText = originalStyle;
                }, 300);
                console.log('Theme changed to:', selectedTheme);
            })
            .catch(error => {
                console.error('Error saving theme:', error);
                themeSelector.style.cssText = originalStyle;
                themeSelector.style.backgroundColor = 'rgba(255, 50, 50, 0.8)';
                setTimeout(() => {
                    themeSelector.style.cssText = originalStyle;
                }, 1000);
            });
        }

        let currentPlayer = '';

        function openCharacterGrid(player) {
            currentPlayer = player;
            document.getElementById('character-grid-backdrop').classList.add('active');
            document.getElementById('character-grid').classList.add('active');
        }

        function closeCharacterGrid() {
            document.getElementById('character-grid-backdrop').classList.remove('active');
            document.getElementById('character-grid').classList.remove('active');
        } 
        
        function selectCharacter(fighter) {
            const inputId = currentPlayer + '-fighter-input';
            const previewId = currentPlayer + '-fighter-preview';
            const nameId = currentPlayer + '-fighter-name';
            const input = document.getElementById(inputId);

            if (input.value === fighter) {
                closeCharacterGrid();
                return;
            }

            input.value = fighter;

            let filename = fighter.toLowerCase();
            if (filename === 'wii-fit-trainer') filename = 'wiifit';
            if (filename === 'meta-knight') filename = 'metaknight';
            if (filename === 'sheik') filename = 'shiek';
            if (filename === 'pokemon-trainer') filename = 'pokemon-trainer';
            if (filename === 'rosalina-luma') filename = 'rosalina';

            const preloadImg = new Image();
            preloadImg.onload = function () {
                const imgElement = document.getElementById(previewId);
                const nameElement = document.getElementById(nameId);
                
                imgElement.src = this.src;
                nameElement.textContent = fighter.replace(/-/g, ' ');

                const characterDiv = imgElement.parentElement.parentElement;
                characterDiv.style.transition = 'all 0.3s ease';
                characterDiv.style.backgroundColor = 'rgba(255, 255, 255, 0.2)';
                characterDiv.style.boxShadow = '0 0 20px rgba(255, 255, 255, 0.3)';

                setTimeout(() => {
                    characterDiv.style.backgroundColor = 'rgba(0, 0, 0, 0.5)';
                    characterDiv.style.boxShadow = 'none';
                }, 300);

                input.dispatchEvent(new Event('change'));
            };

            preloadImg.onerror = function () {
                const imgElement = document.getElementById(previewId);
                const nameElement = document.getElementById(nameId);
                
                imgElement.src = '/images/fighter-ui-slice/random.png';
                imgElement.style.opacity = '0.7';
                nameElement.textContent = fighter.replace(/-/g, ' ');
                nameElement.style.color = '#ffaa00';

                input.dispatchEvent(new Event('change'));
            };

            preloadImg.src = '/images/fighter-ui-slice/' + filename + '.png';
            closeCharacterGrid();
        }

                'Ice-Climbers', 'Sheik', 'Zelda', 'Dr-Mario', 'Pichu', 'Falco', 'Marth', 'Lucina',
                'Young-Link', 'Ganondorf', 'Mewtwo', 'Roy', 'Chrom', 'Mr-Game-Watch', 'Meta-Knight',
                'Pit', 'Dark-Pit', 'Zero-Suit-Samus', 'Wario', 'Snake', 'Ike', 'Pokemon-Trainer',
                'Diddy-Kong', 'Lucas', 'Sonic', 'King-Dedede', 'Olimar', 'Lucario', 'ROB', 'Toon-Link',

        // Quick Action Functions

        function updatePlayerScore(player, amount) {
            const playerNumber = player === 'player1' ? '1' : '2';
            const selectElement = document.querySelector(`select[name="Player${playerNumber}-Score.txt"]`);

            if (selectElement) {
                let currentScore = parseInt(selectElement.value);
                let newScore = Math.max(0, Math.min(3, currentScore + amount));

                if (currentScore !== newScore) {
                    selectElement.value = newScore.toString();
                    selectElement.setAttribute('data-programmatic-change', 'true');

                    const changeEvent = new Event('change', { bubbles: true });
                    selectElement.dispatchEvent(changeEvent);

                    // Visual feedback for the button
                    const button = event.currentTarget;
                    const originalBackground = button.style.backgroundColor;
                    button.style.backgroundColor = 'white';
                    button.style.color = '#000';

                    setTimeout(() => {
                        button.style.backgroundColor = originalBackground;
                        button.style.color = 'white';
                    }, 200);

                    saveAllChangesNow();
                }
            }
        }

        function swapPlayers() {
            // Get player 1 values
            const p1Sponsor = document.querySelector('input[name="Player1-Sponsor.txt"]').value;
            const p1Name = document.querySelector('textarea[name="Enter Player 1 Name.txt"]').value;
            const p1Score = document.querySelector('select[name="Player1-Score.txt"]').value;
            const p1Fighter = document.querySelector('input[name="Player1-Fighter.txt"]').value;
            const p1FighterImg = document.querySelector('#player1-fighter-preview').src;

            // Get player 2 values
            const p2Sponsor = document.querySelector('input[name="Player2-Sponsor.txt"]').value;
            const p2Name = document.querySelector('textarea[name="Enter Player 2 Name.txt"]').value;
            const p2Score = document.querySelector('select[name="Player2-Score.txt"]').value;
            const p2Fighter = document.querySelector('input[name="Player2-Fighter.txt"]').value;
            const p2FighterImg = document.querySelector('#player2-fighter-preview').src;

            // Mark all elements as programmatic changes
            const elements = [
                document.querySelector('input[name="Player1-Sponsor.txt"]'),
                document.querySelector('textarea[name="Enter Player 1 Name.txt"]'),
                document.querySelector('select[name="Player1-Score.txt"]'),
                document.querySelector('input[name="Player1-Fighter.txt"]'),
                document.querySelector('input[name="Player2-Sponsor.txt"]'),
                document.querySelector('textarea[name="Enter Player 2 Name.txt"]'),
                document.querySelector('select[name="Player2-Score.txt"]'),
                document.querySelector('input[name="Player2-Fighter.txt"]')
            ];

            elements.forEach(el => {
                el.setAttribute('data-programmatic-change', 'true');
            });

            // Swap values
            document.querySelector('input[name="Player1-Sponsor.txt"]').value = p2Sponsor;
            document.querySelector('textarea[name="Enter Player 1 Name.txt"]').value = p2Name;
            document.querySelector('select[name="Player1-Score.txt"]').value = p2Score;
            document.querySelector('input[name="Player1-Fighter.txt"]').value = p2Fighter;
            document.querySelector('#player1-fighter-preview').src = p2FighterImg;
            document.querySelector('#player1-fighter-name').textContent = p2Fighter.replace(/-/g, ' ');

            document.querySelector('input[name="Player2-Sponsor.txt"]').value = p1Sponsor;
            document.querySelector('textarea[name="Enter Player 2 Name.txt"]').value = p1Name;
            document.querySelector('select[name="Player2-Score.txt"]').value = p1Score;
            document.querySelector('input[name="Player2-Fighter.txt"]').value = p1Fighter;
            document.querySelector('#player2-fighter-preview').src = p1FighterImg;
            document.querySelector('#player2-fighter-name').textContent = p1Fighter.replace(/-/g, ' ');

            // Update textarea heights
            adjustTextareaHeight(document.querySelector('textarea[name="Enter Player 1 Name.txt"]'));
            adjustTextareaHeight(document.querySelector('textarea[name="Enter Player 2 Name.txt"]'));

            // Visual feedback
            const button = event.currentTarget;
            button.style.transform = 'rotate(180deg)';
            setTimeout(() => {
                button.style.transform = 'none';
                saveAllChangesNow();
            }, 300);
        }

        function resetScoreboard() {
            const elements = [
                document.querySelector('select[name="Player1-Score.txt"]'),
                document.querySelector('input[name="Player1-Fighter.txt"]'),
                document.querySelector('select[name="Player2-Score.txt"]'),
                document.querySelector('input[name="Player2-Fighter.txt"]')
            ];

            elements.forEach(el => {
                el.setAttribute('data-programmatic-change', 'true');
            });

            // Reset scores and fighters
            document.querySelector('select[name="Player1-Score.txt"]').value = '0';
            document.querySelector('select[name="Player2-Score.txt"]').value = '0';

            document.querySelector('input[name="Player1-Fighter.txt"]').value = 'Random';
            document.querySelector('#player1-fighter-preview').src = '/images/fighter-ui-slice/random.png';
            document.querySelector('#player1-fighter-name').textContent = 'Random';

            document.querySelector('input[name="Player2-Fighter.txt"]').value = 'Random';
            document.querySelector('#player2-fighter-preview').src = '/images/fighter-ui-slice/random.png';
            document.querySelector('#player2-fighter-name').textContent = 'Random';

            const button = event.currentTarget;
            button.classList.add('pulse-animation');
            setTimeout(() => {
                button.classList.remove('pulse-animation');
                saveAllChangesNow();
            }, 300);
        }

        function newRound() {
            const elements = [
                document.querySelector('input[name="Player1-Sponsor.txt"]'),
                document.querySelector('textarea[name="Enter Player 1 Name.txt"]'),
                document.querySelector('select[name="Player1-Score.txt"]'),
                document.querySelector('input[name="Player1-Fighter.txt"]'),
                document.querySelector('input[name="Player2-Sponsor.txt"]'),
                document.querySelector('textarea[name="Enter Player 2 Name.txt"]'),
                document.querySelector('select[name="Player2-Score.txt"]'),
                document.querySelector('input[name="Player2-Fighter.txt"]')
            ];

            elements.forEach(el => {
                el.setAttribute('data-programmatic-change', 'true');
            });

            // Reset all player data
            document.querySelector('input[name="Player1-Sponsor.txt"]').value = '';
            document.querySelector('textarea[name="Enter Player 1 Name.txt"]').value = '';
            document.querySelector('select[name="Player1-Score.txt"]').value = '0';
            document.querySelector('input[name="Player1-Fighter.txt"]').value = 'Random';
            document.querySelector('#player1-fighter-preview').src = '/images/fighter-ui-slice/random.png';
            document.querySelector('#player1-fighter-name').textContent = 'Random';

            document.querySelector('input[name="Player2-Sponsor.txt"]').value = '';
            document.querySelector('textarea[name="Enter Player 2 Name.txt"]').value = '';
            document.querySelector('select[name="Player2-Score.txt"]').value = '0';
            document.querySelector('input[name="Player2-Fighter.txt"]').value = 'Random';
            document.querySelector('#player2-fighter-preview').src = '/images/fighter-ui-slice/random.png';
            document.querySelector('#player2-fighter-name').textContent = 'Random';

            // Adjust textarea heights
            adjustTextareaHeight(document.querySelector('textarea[name="Enter Player 1 Name.txt"]'));
            adjustTextareaHeight(document.querySelector('textarea[name="Enter Player 2 Name.txt"]'));

            const button = event.currentTarget;
            button.classList.add('pulse-animation');
            setTimeout(() => {
                button.classList.remove('pulse-animation');
                saveAllChangesWithDelay();
            }, 300);
        }

        function saveAllChangesWithDelay() {
            const savingIndicator = document.getElementById('saving-indicator');
            
            savingIndicator.textContent = 'Saving in 5...';
            savingIndicator.style.display = 'block';
            savingIndicator.style.animation = 'pulse 0.5s infinite alternate';
            savingIndicator.style.cursor = 'pointer';
            
            let countdownInterval;
            let countdown = 5;
            
            const instantSaveHandler = () => {
                clearInterval(countdownInterval);
                savingIndicator.removeEventListener('click', instantSaveHandler);
                savingIndicator.style.cursor = 'default';
                saveAllChangesNow();
            };
            
            savingIndicator.addEventListener('click', instantSaveHandler);
            savingIndicator.title = 'Tap to save instantly';
            
            countdownInterval = setInterval(() => {
                countdown--;
                if (countdown > 0) {
                    savingIndicator.textContent = `Saving in ${countdown}...`;
                } else {
                    clearInterval(countdownInterval);
                    savingIndicator.removeEventListener('click', instantSaveHandler);
                    savingIndicator.style.cursor = 'default';
                    savingIndicator.title = '';
                    saveAllChangesNow();
                }
            }, 1000);
        }
        
        function saveAllChanges() {
            saveAllChangesNow();
        }
        
        function saveAllChangesNow() {
            const savingIndicator = document.getElementById('saving-indicator');
            savingIndicator.textContent = 'Saving...';
            savingIndicator.style.display = 'block';
            savingIndicator.style.animation = 'pulse 0.5s infinite alternate';
            savingIndicator.style.cursor = 'default';
            savingIndicator.title = '';

            const form = document.getElementById('auto-save-form');
            const formData = new FormData(form);

            fetch(form.action || window.location.href, {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.text();
                })
                .then(() => {
                    setTimeout(() => {
                        savingIndicator.style.display = 'none';
                        savingIndicator.style.animation = 'none';

                        const button = event.currentTarget;
                        if (button && button.classList) {
                            button.classList.add('pulse-animation');
                            setTimeout(() => {
                                button.classList.remove('pulse-animation');
                            }, 500);
                        }
                    }, 1000);
                })
                .catch(error => {
                    console.error('Error saving form:', error);
                    savingIndicator.textContent = 'Error!';
                    savingIndicator.style.color = '#ff3333';
                    setTimeout(() => {
                        savingIndicator.style.display = 'none';
                        savingIndicator.style.animation = 'none';
                        savingIndicator.textContent = 'Saving...';
                        savingIndicator.style.color = '#fff';
                    }, 2000);
                });
        }
    </script>
